name: Build - Windows

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read
  pull-requests: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MAKEFLAGS: "-j 2"

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: windows-2022-release
    runs-on: windows-2022

    concurrency:
      group: mazatleraotc-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get vcpkg commit ID
        id: vcpkg-step
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          echo "vcpkgGitCommitId=$commit" >> $env:GITHUB_OUTPUT

      - name: Validate vcpkg baseline SHA
        shell: pwsh
        run: |
          $SHAS = "${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}"
          if ([string]::IsNullOrEmpty($SHAS)) {
            echo "::error title=Missing vcpkg baseline::Provide a full 40-char vcpkgGitCommitId."
            exit 1
          }
          if ($SHAS -notmatch '^[0-9a-f]{40}$') {
            echo "::error title=Invalid vcpkg baseline::vcpkgGitCommitId must be a full 40-char commit SHA."
            exit 1
          }

      - name: Compute vcpkg.json hash
        id: hash
        shell: pwsh
        run: |
          $json = Get-Content "vcpkg.json" -Raw -Encoding UTF8
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha256.ComputeHash($bytes)
          $hash = [BitConverter]::ToString($hashBytes) -replace '-', ''
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-release-${{ steps.hash.outputs.hash }}
          restore-keys: |
            vcpkg-windows-release-

      - name: Compiler cache (sccache)
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "1G"
          variant: "sccache"
          key: ccache-windows-release
          restore-keys: |
            ccache-windows-release

      - name: Remove Windows pre-installed MySQL (for clean builds)
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:/mysql*"

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Configure and Build
        uses: lukka/run-cmake@main
        with:
          configurePreset: windows-release
          buildPreset: windows-release

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          # MazatleraOT: el cliente real es otclient.exe.
          # NUNCA usar "otclient*.exe" con -First 1: con OTCLIENT_BUILD_TESTS=ON
          # el primer match era otclient_map_spectator_tests.exe (GoogleTest) y
          # se publicaba como MazatleraOTC.exe. Los tests quedan desactivados en
          # el preset windows-release (OTCLIENT_BUILD_TESTS=OFF) y ademas se
          # exige el nombre exacto del exe del cliente.
          # OJO ubicacion real: src/CMakeLists.txt pone RUNTIME_OUTPUT_DIRECTORY
          # en ${CMAKE_SOURCE_DIR}/, o sea la RAIZ del repo (el log de build lo
          # confirma: "Linking CXX executable D:\a\MazatleraOTC\MazatleraOTC\otclient.exe").
          # NO esta en build/windows-release.
          $exePath = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "otclient.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exePath) {
            $exePath = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build\windows-release" -Filter "otclient.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exePath) {
            $exePath = Get-ChildItem -Recurse -Path "$env:GITHUB_WORKSPACE\build" -Filter "otclient.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if (-not $exePath) {
            Write-Error "otclient.exe (cliente real) not found in repo root or build/windows-release!"
            exit 1
          }
          if ($exePath.Name -ne "otclient.exe") {
            Write-Error "Refusing to package non-client exe: $($exePath.FullName)"
            exit 1
          }

          Copy-Item $exePath.FullName -Destination "$artifactDir\MazatleraOTC.exe"

          $dlls = Get-ChildItem -Path $exePath.Directory.FullName -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName -Destination $artifactDir
          }

          # Bundle the tracked runtime files so the download is an actual client,
          # not a bare exe. Only the large game assets (data/things: appearances and
          # sprites) stay out - they are gitignored and never present in CI.
          foreach ($item in @("init.lua", "data", "modules", "mods")) {
            $src = Join-Path $env:GITHUB_WORKSPACE $item
            if (Test-Path $src) {
              Copy-Item $src -Destination $artifactDir -Recurse -Force
            }
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazatleraOTC-windows-release
          path: ${{ github.workspace }}/artifacts

  release:
    name: Publish "latest" release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MazatleraOTC-windows-release
          path: artifacts

      - name: Zip binaries
        run: cd artifacts && zip -r ../MazatleraOTC-windows.zip .

      - name: Recreate "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest MazatleraOTC-windows.zip \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automatic build of the latest \`main\` commit ${GITHUB_SHA::7}.

          Contains a runnable client: the executable plus init.lua, data, modules and mods. Only the large game assets (\`data/things\`: appearances and sprites) are NOT included - add them separately (see the README or the wiki's Game Assets page)."
